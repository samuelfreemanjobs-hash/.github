# Inject as <runtime_context> each run. Orchestrator fills all REQUIRED fields.

today: "2026-09-12" # REQUIRED — YYYY-MM-DD

niche: "" # REQUIRED
icp: "" # REQUIRED — role, firmographics, budget band
icp_constraints: "" # geo, exclusions, industries to avoid

offer_catalog: [] # optional — { name, price_band } items you actually sell
cadence: weekly # weekly | ad_hoc
run_id: "" # orchestrator UUID for storage / dedupe

output_modes:
  - ExecutiveBriefMD
  # - JSON

search_budget: 24 # each web search AND each URL fetch = 1 unit

recency_window_days: 365
evidence_exceptions: []

confidence_gate: 0.65

prior_run_opportunities: []

owner_role: ""
owner_capabilities: ""

score_weights:
  confidence: 0.2
  urgency: 0.2
  revenue_potential: 0.2
  icp_fit: 0.2
  ease: 0.2

min_opportunities: 0
max_opportunities: 5
allow_hypothesis_in_brief: false # if false, brief is Validated-only or empty + rejected

hunter_handoff: false

# Presets (see BRIEF-PROFILES.yaml, DESIGN-TENSION-CONFIDENCE.md)
brief_profile: client_facing # client_facing | internal_lab | balanced
# sector_profile: automotive_supplier
